name: Arena Autopilot

# فاز ۶ — اتوپایلوت میدان ایجنت‌ها
# هر ۳۰ دقیقه: پیش‌بردن پوزیشن‌های باز (TP/SL/تایم‌اوت) + رژیم بازار + اسکن و بازکردن معامله‌ی تازه
# الزامات: دو Secret در Settings → Secrets and variables → Actions:
#   SUPABASE_URL  (https://xxxx.supabase.co)
#   SUPABASE_KEY  (کلید publishable/anon)
# توقف موقت: تب Actions → Arena Autopilot → ⋯ → Disable workflow
# فاز ۷ — اگر هر اجرایی شکست بخورد، خودکار یک Issue هشدار باز می‌شود
# (Issue تکراری ساخته نمی‌شود تا وقتی Issue باز قبلی بسته شود)
# فاز ۱۱ — نوتیفیکیشن ریل‌تایم تلگرام: بازشدن/بسته‌شدن پوزیشن و تغییر رژیم
#   دو Secret تازه: TELEGRAM_BOT_TOKEN ، TELEGRAM_CHAT_ID (اگر ست نباشد فقط پیام نمی‌رود، اجرا سالم است)

on:
  schedule:
    - cron: "*/30 * * * *"   # هر ۳۰ دقیقه (UTC)
  workflow_dispatch: {}       # اجرای دستی برای تست

permissions:
  issues: write               # فقط برای ساخت Issue هشدار در صورت شکست

concurrency:
  group: arena-autopilot
  cancel-in-progress: false   # اجرای هم‌پوشان ممنوع — نوبت بماند، قطع نشود

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run autopilot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARENA_EXCHANGE: Lighter    # تمرکز میدان روی صرافی لایتر (پرپ DEX)
          ARENA_INTERVAL: 1hour
          ARENA_APPETITE: hunter
          ARENA_EDGE_MODE: bench_losers
          # حالت سبک (فقط مدیریت پوزیشن‌ها، بدون اسکن): ARENA_SCAN را ۰ کنید
          ARENA_SCAN: "1"
        run: python -m core.autopilot

      - name: کمربند احتیاطی بات — تخلیه‌ی سریع صف دستورها
        if: always()          # حتی اگر اتوپایلوت شکست خورد، دستورهای بات بی‌جواب نمانند
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_EXCHANGE: Lighter      # فقط معاملات لایتر در پیام‌های بات
        run: python -m core.tg_bot --once

      - name: هشدار شکست — پیام تلگرام
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":${TELEGRAM_CHAT_ID},\"parse_mode\":\"HTML\",\"text\":\"🔴 <b>اتوپایلوت شکست خورد!</b>\\n\\n📍 اجرای #${GITHUB_RUN_NUMBER} با خطا تمام شد.\\n🕐 $(date -u '+%H:%M') UTC\\n📄 لاگ: تب Actions گیت‌هاب\"}" \
              && echo "پیام تلگرام ارسال شد" || echo "ارسال تلگرام ناموفق (غیربحرانی)"
          else
            echo "تلگرام پیکربندی نشده — رد شد"
          fi

      - name: هشدار شکست — بازکردن Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create autopilot-fail --repo "$GITHUB_REPOSITORY" \
            --color D73A4A --description "شکست اجرای اتوپایلوت" --force || true
          if gh issue list --repo "$GITHUB_REPOSITORY" --label autopilot-fail \
               --state open --limit 1 | grep -q .; then
            echo "Issue هشدار از قبل باز است — تکرار ساخته نمی‌شود"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --label autopilot-fail \
              --title "🔴 اتوپایلوت شکست خورد — بررسی شود" \
              --body "اجرای [run #$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) شکست خورد.\n\n- زمان (UTC): $(date -u '+%Y-%m-%d %H:%M')\n- لاگ: همان صفحه → job → مرحله‌ی شکست‌خورده\n\nبعد از رفع مشکل این Issue را ببندید تا هشدار برای شکست بعدی دوباره کار کند." \
              && echo "Issue هشدار ساخته شد"
          fi
