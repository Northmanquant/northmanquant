name: Build Android APK

# Builds a debug APK every time you push, and whenever you trigger it manually.
# The finished APK is uploaded as a downloadable artifact (and attached to a
# Release when you push a tag like v1.0.0). Completely free on GitHub-hosted runners.

on:
  push:
    branches: [main, master]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
  release:
    types: [created]

permissions:
  contents: write            # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest image already ships a full Android SDK.
      # We just point to it instead of installing a new one (avoids the
      # "Wrong version in preinstalled sdkmanager" failure).
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME is $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Capacitor dependencies
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android || echo "android platform already present"
          npx cap sync android

      - name: Generate app icon & splash screen
        run: npx capacitor-assets generate --android || echo "assets step skipped"

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/NorthmanQuant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthmanQuant-APK
          path: mobile-app/output/NorthmanQuant.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/output/NorthmanQuant.apk
