name: Build Android APK

# Builds a debug APK every time you push, and whenever you trigger it manually.
# The finished APK is uploaded as a downloadable artifact (and attached to a
# Release when you push a tag like v1.0.0). Completely free on GitHub-hosted runners.

on:
  push:
    branches: [main, master]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
  release:
    types: [created]

permissions:
  contents: write            # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest image already ships a full Android SDK.
      # We just point to it instead of installing a new one (avoids the
      # "Wrong version in preinstalled sdkmanager" failure).
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME is $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Create the Android project
        run: |
          npx cap add android || echo "android platform already present"
          npx cap sync android

      - name: Generate app icon & splash screen
        run: npx capacitor-assets generate --android || echo "assets step skipped"

      # امضای پایدار APK: کی‌استور (Secret) کنار ماژول اپ می‌نشیند و با یک
      # پچ قطعی (قالب Capacitor هیچ signingConfig‌ای ندارد) به buildType دیباگ
      # وصل می‌شود. بدون این، هر رانر کلید تصادفی خودش را می‌سازد و آپدیتِ
      # روی نسخه‌ی قبلی با خطای «package conflicts» رد می‌شود.
      - name: Install stable signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > android/app/stable.keystore
          python3 patch_signing.py
          keytool -list -keystore android/app/stable.keystore -storepass android 2>/dev/null | grep androiddebugkey

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          FP=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}')
          echo "APK cert SHA-256: $FP"
          case "$FP" in
            9B:14:45:42:B7:72:20:39:07:10:D6:2B:C5:76:1A:DF:1F:B6:BB:37:D4:EC:A9:F9:93:56:1E:7D:7E:51:4A:06)
              echo "امضای پایدار ✓";;
            '')
              echo "هشدار: امضای v1 خوانده نشد — بررسی دستی لازم";;
            *)
              echo "خطا: APK با کلید پایدار امضا نشده"; exit 1;;
          esac

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/NorthmanQuant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NorthmanQuant-APK
          path: mobile-app/output/NorthmanQuant.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: mobile-app/output/NorthmanQuant.apk
