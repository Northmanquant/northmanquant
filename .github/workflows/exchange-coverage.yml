# پوششِ اجراییِ صرافی‌ها — ضربانِ روزانه‌ی هر ۸ venue — NorthmanQuant
# قاعده‌ی پروژه: همه‌ی ماژول‌ها همه‌ی صرافی‌های core/exchanges را پوشش بدهند.
# تستِ استاتیکِ رجیستری (test_exchange_registry.py) لیست‌های محلیِ ناقص را می‌گیرد؛
# این جاب نیمیِ دیگر را می‌گیرد: هر روز از «مسیرِ واقعیِ اپ» ولی بدونِ فال‌بکِ
# میان‌ونکیته، تیک/کندل/فهرستِ ارزِ هر ۸ صرافی را می‌کوبد و snapshot + تاریخچه
# را در core/data/exchange_coverage.json / _log.jsonl ثبت می‌کند تا افتِ کیفیتِ
# داده‌ی هر venue روزبه‌روز دیده شود (مثل مرگِ KCEX از این محیط).
#
# ساعت: ۰۸:۱۵ تهران — قبل از جاب‌های شاهد (۰۹:۳۰ و ۰۹:۵۰) تا سلامتِ داده‌ی
# هر venue قبل از جلساتِ همان روز ثبت شده باشد.
# خروجِ ناپایا فقط وقتی که «همه» venueها مرده‌اند (خرابیِ زیرساخت) —
# شکستگیِ جزئی (مثل KCEX) سبز می‌ماند ولی در snapshot ثبت و گزارش می‌شود.

name: Exchange Coverage Daily

on:
  schedule:
    - cron: "45 4 * * *"   # ۰۸:۱۵ تهران (UTC+3:30)
  workflow_dispatch: {}    # اجرای دستی برای تست
  push:                    # اجرا فقط وقتی خودِ جاب یا اسکریپتِ آن عوض شد — تغییرِ core/data شلیک نمی‌کند
    branches: [main]
    paths: [".github/workflows/exchange-coverage.yml", "scripts/exchange_coverage.py"]

permissions:
  contents: write          # برای commit کردنِ snapshot و تاریخچه

concurrency:
  group: exchange-coverage-daily
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصبِ وابستگی‌ها
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: نگهبانِ استاتیکِ رجیستری — هیچ ماژولی لیستِ صرافیِ محلیِ ناقص ندارد؟
        run: python scripts/test_exchange_registry.py

      - name: ضربانِ زنده‌ی هر ۸ صرافی — تیک/کندل/ارزها بدونِ فال‌بک
        run: python scripts/exchange_coverage.py

      - name: ثبتِ snapshot و تاریخچه در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/data/exchange_coverage.json core/data/exchange_coverage_log.jsonl
          git diff --cached --quiet || git commit -m "📡 پوششِ صرافی‌ها: ضربانِ روزانه‌ی ۸ venue ثبت شد (workflow)"
          git pull --rebase origin main || echo "⚠️ rebase نشد — رانِ بعدی دوباره تلاش می‌کند"
          git push origin main || echo "⚠️ پوش نشد — فردا دوباره تلاش می‌شود؛ snapshot در رانِ بعدی commit می‌شود"
