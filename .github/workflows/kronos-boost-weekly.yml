# بچِ تقویتیِ هفتگیِ شاهدِ کرونوس — NorthmanQuant
# جابِ روزانه ۸ جلسه در روز می‌گیرد؛ با این ریتم دروازه‌ی ۲۰۰تایی ~۲۵ روز
# طول می‌کشد و همه‌ی جلساتِ یک روز هم‌بسته‌اند (همان رژیمِ بازار). این جاب
# شنبه‌ها ۱۲ نماد × ۳ تایم‌فریم = ۳۶ جلسه می‌گیرد تا دروازه با تنوعِ رژیمِ
# بازار در طولِ هفته‌ها پر شود، نه یک‌روزه و هم‌بسته.
#
# همان زنجیره‌ی نصبِ جابِ روزانه؛ فقط نمادها صریح‌تر و تعداد بیشتر است.
# وقتی دروازه پر شد و حکم اجرا شد، هر دو جاب را می‌شود غیرفعال کرد.

name: Kronos Weekly Boost

on:
  schedule:
    - cron: "0 3 * * 6"    # شنبه ۰۶:۳۰ تهران (UTC+3:30)
  workflow_dispatch: {}    # اجرای دستی برای تست

permissions:
  contents: write

concurrency:
  group: kronos-weekly-boost
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصبِ وابستگی‌ها (torch فقط CPU)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          pip install --quiet einops huggingface_hub safetensors tqdm

      - name: کلونِ مخزنِ رسمیِ کرونوس
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos "$HOME/Kronos"

      - name: پیش‌پرواز — چکِ زنجیره‌ی import مدل
        run: cd "$HOME/Kronos" && python -c "import torch, einops, huggingface_hub, safetensors, tqdm; from model import Kronos, KronosTokenizer, KronosPredictor; print('زنجیره‌ی مدل سالم است — torch', torch.__version__)"

      - name: بچِ تقویتی — ۱۲ نماد × ۳ تایم‌فریم (مدلِ واقعی روی کندلِ زنده)
        env:
          KRONOS_BACKEND: kronos
          KRONOS_REPO: /home/runner/Kronos
          HF_HOME: /home/runner/hf
        run: |
          SYMS="BTC-USDT,ETH-USDT,SOL-USDT,BNB-USDT,XRP-USDT,DOGE-USDT,ADA-USDT,LINK-USDT,TON-USDT,DOT-USDT,ATOM-USDT,OP-USDT"
          python scripts/kronos_session.py --symbols "$SYMS" --interval 1hour
          python scripts/kronos_session.py --symbols "$SYMS" --interval 4hour
          python scripts/kronos_session.py --symbols "$SYMS" --interval 1day

      - name: ثبتِ دفترِ دروازه در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # دفترِ دروازه + سابقه/آرشیوِ روزِ حکم با هم commit می‌شوند (فازِ پنج)
          git add core/data/
          git diff --cached --quiet || git commit -m "🔮 کرونوس: بچِ تقویتیِ هفتگی در دفترِ دروازه ثبت شد (۳۶ جلسه)"
          git pull --rebase origin main || echo "⚠️ rebase نشد — رانِ بعدی دوباره تلاش می‌کند"
          git push origin main || echo "⚠️ پوش نشد — هفته‌ی بعد دوباره تلاش می‌شود"
