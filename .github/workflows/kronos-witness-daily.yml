# شاهدِ کرونوس — جلسه‌ی paper برای دروازه‌ی فازِ یک — NorthmanQuant
# نقشه‌ی جدول ۴ گزارشِ کرونوس: دروازه‌ی خروجِ فازِ یک = «هم‌جهتیِ >۵۵٪ روی
# ۲۰۰ جلسه‌ی paper-trade» با مدلِ واقعی. این جاب روی کندلِ زنده، جلسه‌ی
# کاملِ اتاقِ تیم + شاهدِ مدلِ واقعی (Kronos-mini از مخزنِ رسمی) می‌گیرد و
# دفترِ core/data/kronos_log.jsonl را در همین مخزن commit می‌کند.
#
# کادانسِ هر ۳ ساعت (هم‌ریتمِ جابِ نبیه): ستاپ‌های چارت فقط در «آستانه‌ی
# شکل‌گیری» (۲ کندلِ آخر) فعال می‌شوند و با چرخشِ روزانه، دروازه‌ی ۲۰۰
# سیگنال‌دار ماه‌ها طول می‌کشید؛ ۸ نوبتِ شکار در روز + چیدمانِ داغِ
# --hot (از نقشه‌ی نشاطِ مشترکِ core/signal_map که جابِ نبیه — سبک‌تر و
# بدونِ torch — هر سه ساعت می‌سازد و commit می‌کند) همان را درمان کرد.
# اگر نقشه کهنه/غایب بود، فال‌بکِ امن به چرخشِ تقویمی.
#
# هزینه: CPU-only (بدونِ GPU) — وابستگیِ سنگینِ فقطِ torch است؛ مدلِ mini
# فقط ~۱۶ مگابایت است و وزنش از HF Hub دانلود می‌شود.
# اگر دروازه پر شد و فازِ دو شروع شد، این جاب می‌تواند غیرفعال شود:
#   تب Actions → Kronos Witness Daily → ⋯ → Disable workflow

name: Kronos Witness Daily

on:
  schedule:
    - cron: "0 */3 * * *"  # هر ۳ ساعت — نیم‌ساعت قبل از جابِ نبیه (نقشه‌ی تازه مصرف می‌کند)
  workflow_dispatch: {}    # اجرای دستی برای تست
  push:                    # اجرا فقط وقتی جاب یا اسکریپت‌هایش عوض شد — تغییرِ core/data شلیک نمی‌کند
    branches: [main]
    paths: [".github/workflows/kronos-witness-daily.yml", "scripts/kronos_session.py", "core/signal_map.py"]

permissions:
  contents: write          # برای commit کردنِ دفترِ دروازه

concurrency:
  group: kronos-witness-daily
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصبِ وابستگی‌ها (torch فقط CPU)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          # زنجیره‌ی لودِ مدلِ کرونوس: einops/hf_hub/safetensors/tqdm در requirementsِ پروژه نیستند
          pip install --quiet einops huggingface_hub safetensors tqdm

      - name: کلونِ مخزنِ رسمیِ کرونوس
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos "$HOME/Kronos"

      - name: پیش‌پرواز — چکِ زنجیره‌ی import مدل (خطای گویا به‌جای fallbackِ خاموش)
        run: cd "$HOME/Kronos" && python -c "import torch, einops, huggingface_hub, safetensors, tqdm; from model import Kronos, KronosTokenizer, KronosPredictor; print('زنجیره‌ی مدل سالم است — torch', torch.__version__)"

      - name: جلسه‌ی شاهد — اولِ داغ‌هایِ نقشه‌ی نشاط، بعدِ چرخش (سه تایم‌فریم)
        env:
          KRONOS_BACKEND: kronos
          KRONOS_REPO: /home/runner/Kronos
          HF_HOME: /home/runner/hf
        run: |
          python scripts/kronos_session.py --rotate 3 --hot 2 --interval 1hour
          python scripts/kronos_session.py --rotate 3 --hot 2 --interval 4hour
          python scripts/kronos_session.py --rotate 2 --hot 2 --interval 1day

      - name: ثبتِ دفترِ دروازه در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # اول add/commitِ تغییراتِ محلی (دفترِ دروازه + سابقه/آرشیوِ روزِ حکم)، بعد rebase روی origin، بعد push
          git add core/data/
          git diff --cached --quiet || git commit -m "🔮 کرونوس: جلساتِ paperِ امروز در دفترِ دروازه ثبت شد (workflow روزانه)"
          git pull --rebase origin main || echo "⚠️ rebase نشد — رانِ بعدی دوباره تلاش می‌کند"
          git push origin main || echo "⚠️ پوش نشد — فردا دوباره تلاش می‌شود؛ دفتر در رانِ بعدی commit می‌شود"
