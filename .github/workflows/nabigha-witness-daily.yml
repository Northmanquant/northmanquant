# شاهدِ نبیه — جلسه‌ی روزانه‌ی paper برای دروازه‌ی موتورِ بومی — NorthmanQuant
# هم‌شکلِ جابِ کرونوس، ولی بدونِ torch و بدونِ وزنِ خارجی: موتورِ نبیه
# تماماً محلی است — همین requirementsِ پروژه کافی است و رانِ سبک می‌ماند.
#
# سه تایم‌فریمِ همان کرونوس تا مقایسه‌ی منصفانه باشد (1hour/4hour/1day)،
# بعد از جلسات، گرِیدرِ پیامدِ مشترک هر دو دفتر را نمره می‌دهد تا
# hit-rateِ واقعیِ بازار کنارِ هم‌جهتیِ چارت، روزانه جمع شود.
#
# اگر روزی لازم نشد: تب Actions → Nabigha Witness Daily → ⋯ → Disable workflow

name: Nabigha Witness Daily

on:
  schedule:
    - cron: "20 6 * * *"   # ۰۹:۵۰ تهران — بعد از جابِ کرونوس (۰۹:۳۰)
  workflow_dispatch: {}    # اجرای دستی برای تست

permissions:
  contents: write          # برای commit کردنِ دفتر و پیامدها

concurrency:
  group: nabigha-witness-daily
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصبِ وابستگی‌ها (بدونِ torch — نبیه محلی است)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: پیش‌پرواز — چکِ سلامتِ موتور
        run: python scripts/test_nabigha_engine.py

      - name: جلسه‌ی روزانه‌ی نبیه — همان کندل‌ها به اتاق و موتور (سه تایم‌فریم)
        run: |
          python scripts/nabigha_session.py --rotate 3 --interval 1hour
          python scripts/nabigha_session.py --rotate 3 --interval 4hour
          python scripts/nabigha_session.py --rotate 2 --interval 1day

      - name: گرِیدرِ پیامد — نمره‌دادن به پیش‌بینی‌های بالغِ کرونوس و نبیه
        run: python scripts/paper_grade.py --engine all --horizon 3

      - name: ثبتِ دفتر و پیامدها در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/data/
          git diff --cached --quiet || git commit -m "🧭 نبیه: جلساتِ paperِ امروز + نمره‌ی پیامدها ثبت شد (workflow روزانه)"
          git pull --rebase origin main || echo "⚠️ rebase نشد — رانِ بعدی دوباره تلاش می‌کند"
          git push origin main || echo "⚠️ پوش نشد — فردا دوباره تلاش می‌شود؛ دفتر در رانِ بعدی commit می‌شود"
