# شاهدِ نبیه — جلسه‌های paper برای دروازه‌ی موتورِ بومی — NorthmanQuant
# هم‌شکلِ جابِ کرونوس، ولی بدونِ torch و بدونِ وزنِ خارجی: موتورِ نبیه
# تماماً محلی است — همین requirementsِ پروژه کافی است و رانِ سبک می‌ماند.
#
# سه تایم‌فریمِ همان کرونوس تا مقایسه‌ی منصفانه باشد (1hour/4hour/1day)،
# بعد از جلسات، گرِیدرِ پیامدِ مشترک هر دو دفتر را نمره می‌دهد تا
# hit-rateِ واقعیِ بازار کنارِ هم‌جهتیِ چارت جمع شود.
#
# کادانسِ هر ۳ ساعت: ستاپ‌های چارت فقط در «آستانه‌ی شکل‌گیری» (۲ کندلِ آخر)
# فعال می‌شوند و با چرخشِ روزانه، دروازه‌ی ۲۰۰ سیگنال‌دار ماه‌ها طول
# می‌کشید؛ ۸ نوبت در روز آستانه‌ها را می‌شکارَد و نقشه‌ی نشاط
# (nabigha_signal_sweep) نمادهایِ زنده را به --hot می‌دهد.
#
# اگر روزی لازم نشد: تب Actions → Nabigha Witness Daily → ⋯ → Disable workflow

name: Nabigha Witness Daily

on:
  schedule:
    - cron: "50 */3 * * *"  # هر ۳ ساعت — شکارِ آستانه‌ی ستاپ‌ها برای دروازه
  workflow_dispatch: {}    # اجرای دستی برای تست
  push:                    # اجرا فقط وقتی جاب یا اسکریپت‌هایش عوض شد — تغییرِ core/data شلیک نمی‌کند
    branches: [main]
    paths: [".github/workflows/nabigha-witness-daily.yml", "scripts/nabigha_session.py", "scripts/paper_grade.py", "scripts/kronos_nabigha_report.py", "scripts/nabigha_signal_sweep.py", "core/signal_map.py"]

permissions:
  contents: write          # برای commit کردنِ دفتر و پیامدها

concurrency:
  group: nabigha-witness-daily
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصبِ وابستگی‌ها (بدونِ torch — نبیه محلی است)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: پیش‌پرواز — چکِ سلامتِ موتور
        run: python scripts/test_nabigha_engine.py

      - name: نقشه‌ی نشاط — کدام نماد×تایم‌فریم چارت‌شان زنده است؟
        run: python scripts/nabigha_signal_sweep.py

      - name: جلسه‌ی نبیه — اولِ داغ‌هایِ نقشه، بعدِ چرخش (سه تایم‌فریم)
        run: |
          python scripts/nabigha_session.py --rotate 3 --hot 2 --interval 1hour
          python scripts/nabigha_session.py --rotate 3 --hot 2 --interval 4hour
          python scripts/nabigha_session.py --rotate 2 --hot 2 --interval 1day

      - name: گرِیدرِ پیامد — نمره‌دادن به پیش‌بینی‌های بالغِ کرونوس و نبیه
        run: python scripts/paper_grade.py --engine all --horizon 3

      - name: قاضیِ کرونوس ↔ نبیه — گزارشِ مقایسه با هر روزِ داده پخته‌تر می‌شود
        run: python scripts/kronos_nabigha_report.py

      - name: ثبتِ دفتر و پیامدها در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/data/
          git diff --cached --quiet || git commit -m "🧭 نبیه: جلساتِ paperِ امروز + نمره‌ی پیامدها + قاضیِ ک↔ن ثبت شد (workflow روزانه)"
          git pull --rebase origin main || echo "⚠️ rebase نشد — رانِ بعدی دوباره تلاش می‌کند"
          git push origin main || echo "⚠️ پوش نشد — فردا دوباره تلاش می‌شود؛ دفتر در رانِ بعدی commit می‌شود"
