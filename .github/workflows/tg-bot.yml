# بات تلگرام میدان — فاز ۱۵
# هر ۵ دقیقه: خواندن دستورهای تازه (/top · /signals · /stats · /help) و پاسخ
# + خلاصه‌ی روزانه‌ی میدان (یک‌بار در شبانه‌روز تهران، ضدتکرار با جدول arena_alerts)
#
# الزامات (Secrets):
#   TELEGRAM_BOT_TOKEN   توکن بات از @BotFather
#   TELEGRAM_CHAT_ID     چت مالک (پیام‌های لحظه‌ای + خلاصه‌ی روزانه)
#   TELEGRAM_ALLOWED_CHATS   (اختیاری) چت‌های مجاز دیگر، با کاما — «*» = عمومی
#   SUPABASE_URL / SUPABASE_KEY   برای نشانگر ضدتکرار خلاصه‌ی روزانه
#
# توقف موقت: تب Actions → TG Bot → ⋯ → Disable workflow
# پاسخ حداکثر ~۵ دقیقه طول می‌کشد (معماری بدون‌سرور، مثل اتوپایلوت).

name: TG Bot

on:
  schedule:
    - cron: "*/5 * * * *"     # هر ۵ دقیقه (UTC)
  workflow_dispatch: {}        # اجرای دستی برای تست

concurrency:
  group: tg-bot
  cancel-in-progress: true     # چرخه‌ی قبلی اگر کش آمد، بی‌فایده است — قطعش کن

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll & reply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m core.tg_bot
