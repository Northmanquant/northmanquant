# بات تلگرام میدان — فاز ۱۵ + تعمیر پایداری
# هر ۵ دقیقه: تخلیه‌ی کامل صف دستورها (/top · /signals · /positions · /price · /stats · /help)
# + long-poll ~۴ دقیقه‌ای یعنی پاسخ معمولاً چندثانیه‌ای؛ حتی اگر کرون گیت‌هاب
#   عقب افتاد، اتوپایلوت هر ۳۰ دقیقه یک «--once» کمربندی هم اجرا می‌کند
# + خلاصه‌ی روزانه‌ی میدان (یک‌بار در شبانه‌روز تهران، ضدتکرار با arena_alerts)
#
# تمرکز ربات: BOT_EXCHANGE=Lighter — فقط معاملات صرافی لایتر نمایش/ارسال می‌شود
# (اتوپایلوت هم با ARENA_EXCHANGE=Lighter روی همان صرافی معامله می‌کند).
#
# الزامات (Secrets):
#   TELEGRAM_BOT_TOKEN   توکن بات از @BotFather
#   TELEGRAM_CHAT_ID     چت مالک (پیام‌های لحظه‌ای + خلاصه‌ی روزانه)
#   TELEGRAM_ALLOWED_CHATS   (اختیاری) چت‌های مجاز دیگر، با کاما — «*» = عمومی
#   SUPABASE_URL / SUPABASE_KEY   برای نشانگر ضدتکرار خلاصه‌ی روزانه
#
# توقف موقت: تب Actions → TG Bot → ⋯ → Disable workflow

name: TG Bot

on:
  schedule:
    - cron: "*/5 * * * *"     # هر ۵ دقیقه (UTC)
  workflow_dispatch: {}        # اجرای دستی برای تست

concurrency:
  group: tg-bot
  cancel-in-progress: true     # چرخه‌ی قبلی اگر کش آمد، بی‌فایده است — قطعش کن

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll & reply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_EXCHANGE: Lighter      # فقط معاملات لایتر در پیام‌های بات
        run: python -m core.tg_bot
