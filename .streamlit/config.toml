# .streamlit/config.toml — نسخه اصلاح‌شده
# تغییر مهم: enableCORS = false حذف شد (با امنیت XSRF تداخل دارد)

[server]
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

# اگر قبلاً [theme] داشتید، همان بلاک را برگردانید:
# [theme]
# base = "dark"
# primaryColor = "#00E5A0"
# backgroundColor = "#0E1117"
# secondaryBackgroundColor = "#161B26"
# textColor = "#FAFAFA"
